# mysbx sidecar config
# The repo this sidecar belongs to is implicit: it is always mounted
# read-write at its real host path and cannot be changed here
# (docs/design/config.md D13).
#
# Everything else in the sandbox is opt-in. Examples:
#
# [[mounts]]
# path = "/home/user/.config/git"
# mode = "ro"
#
# [env]
# EDITOR = "nvim"

# The interactive payload: which terminal multiplexer `mysbx` starts
# instead of a plain shell (docs/design/config.md D17).
# One of: "tmux", "workmux", "herdr", "aoe", "none".
# `init` records the value the user configuration layer names, so this
# file changes nothing until it is edited — the sidecar wins.
multiplexer = "none"
