# Every key of the schema, as a sidecar config would use them. The repo
# itself is not part of the schema — it is implicit (config.md D13).
backend = "bwrap"
network = true

# The multiplexer (config.md D17): the INTERACTIVE payload is a session
# of the named multiplexer instead of a plain shell (`mysbx run -- CMD`
# is unaffected, cli.md D11). One of "tmux", "workmux", "herdr", "aoe",
# "none". The private socket directory is not configurable: it always
# lives at /mysbx-home/.mysbx-tmux, inside the sandbox home tmpfs, so it
# can never be shared with a host tmux server or with another sandbox.
multiplexer = "workmux"

# State directories (config.md D15): sandbox-home-relative paths whose
# content persists in the sidecar across runs — backed by
# `<repo>.mysbx/state/<entry>` and bound rw at `/mysbx-home/<entry>`.
state-dirs = [".local/share/opencode", ".local/state/opencode"]

[[mounts]]
path = "/home/user/.config/pi"
mode = "ro"

[[mounts]]
path = "/home/user/.cache/mysbx/project"
dest = "/home/user/.cache"
mode = "rw"

[env]
TERM = "xterm-256color"
LANG = "C.UTF-8"
