# Every key of the schema, as a sidecar config would use them. The repo
# itself is not part of the schema — it is implicit (config.md D13).
backend = "bwrap"
network = true

# The multiplexer (config.md D17): the INTERACTIVE payload is a session
# of the named multiplexer instead of a plain shell (`mysbx run -- CMD`
# is unaffected, cli.md D11). One of "tmux", "workmux", "herdr",
# "aoe", "orca", "none". The private socket directory is not
# configurable: it always lives at /mysbx-home/.mysbx-tmux, inside the
# sandbox home tmpfs, so it can never be shared with a host tmux server
# or with another sandbox.
multiplexer = "workmux"

# The display (config.md D18): how a Wayland compositor reaches the
# sandbox — `off` for a headless run (the default), `waypipe` for the
# per-run waypipe channel. The guest display socket always lives at
# /mysbx-home/wayland-0, inside the sandbox home tmpfs; the host
# compositor socket and $XDG_RUNTIME_DIR are never bound.
display = "waypipe"

# State directories (config.md D15): sandbox-home-relative paths whose
# content persists in the sidecar across runs — backed by
# `<repo>.mysbx/state/<entry>` and bound rw at `/mysbx-home/<entry>`.
state-dirs = [".local/share/opencode", ".local/state/opencode"]

# The network allowlist (bd myconfig-mo3.1/myconfig-6di.2): the domains
# the sandbox may connect to and the TCP ports it may connect to and
# listen on. Backend-agnostic policy — the `nono` backend enforces them
# (per-domain via its proxy, per-port via Landlock/seccomp); a backend
# that cannot enforce them refuses the run instead of ignoring them.
allow-domains = ["api.openai.com", "github.com"]
connect-ports = [443, 22]
listen-ports = [8080]

[[mounts]]
path = "/home/user/.config/pi"
mode = "ro"

[[mounts]]
path = "/home/user/.cache/mysbx/project"
dest = "/home/user/.cache"
mode = "rw"

[env]
TERM = "xterm-256color"
LANG = "C.UTF-8"
