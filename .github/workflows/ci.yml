name: CI

on: [push]


jobs:
  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
    - run: git config --global init.defaultBranch main
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix flake check --all-systems

  try-develop:
    runs-on: ubuntu-latest
    steps:
    - run: git config --global init.defaultBranch main
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          experimental-features = nix-command flakes
    - run: nix develop --impure --command echo "success"

  nixfmt-check:
    runs-on: ubuntu-latest
    steps:
    - run: git config --global init.defaultBranch main
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
        extra_nix_config: |
          experimental-features = nix-command flakes
    - run: ./nixfmtall.sh --check

  stale-override-check:
    # Fail when a nixpkgs commit that makes a local override redundant
    # (see flake.pkgs_overrides.nix TODO notes) is reachable from the flake's
    # pinned nixpkgs-unstable input. See check-stale-overrides.sh.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - run: ./.github/scripts/check-stale-overrides.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-os:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config:
          - { host: test-f13 , action: "build --dry-run" }
          # - { host: test-f13 , action: "build" }
          - { host: test-workstation , action: "build --dry-run" }
          # - { host: test-workstation , action: "build" }
          - { host: test-nas , action: "build --dry-run" }
          # - { host: test-nas , action: "build" }
          - { host: test-vserver , action: "build --dry-run" }
          # - { host: test-vserver , action: "build" }
          - { host: test-p14 , action: "build --dry-run" }
          # - { host: test-p14 , action: "build" }
          - { host: test-nuc , action: "build --dry-run" }
          # - { host: test-nuc , action: "build" }
          - { host: test-r6c , action: "build --dry-run" }
          # - { host: test-r6c , action: "build" }
          - { host: test-thing , action: "build --dry-run" }
          # - { host: test-thing , action: "build" }
      fail-fast: false

    steps:
    - run: git config --global init.defaultBranch main
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix ${{ matrix.config.action }} -L '.#nixosConfigurations.'${{ matrix.config.host }}'.config.system.build.toplevel'

  build-iso:
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - run: git config --global init.defaultBranch main
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: ./build-iso-image.sh
  #   - uses: actions/upload-artifact@v2
  #     with:
  #       name: myconfig-iso-${{ matrix.config.name }}
  #       path: '__out/**/*.iso'
  #     if: steps.isNonDry.outputs.result
